# Football Score App - Production Configuration
# All secrets injected via Railway/Platform environment variables

spring.profiles.active=production

# Database (Injected by Railway PostgreSQL)
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USER}
# spring.datasource.password=${DATABASE_PASSWORD}

# Redis (Injected by Railway Redis)
# spring.data.redis.url=${REDIS_URL}

# Football Provider
football.provider=sportmonks
sportmonks.api.token=${SPORTMONKS_API_TOKEN}
sportmonks.api.base-url=https://api.sportmonks.com/v3/football

# WhatsApp (Injected as secrets)
whatsapp.enabled=true
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.waba-id=${WHATSAPP_WABA_ID}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.app-secret=${WHATSAPP_APP_SECRET}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=30

# Frontend URL (for CORS)
app.frontend-url=${FRONTEND_URL}

# Scheduler (Production tuning)
scheduler.live-match-poll-interval-seconds=30
scheduler.upcoming-match-poll-interval-minutes=5
scheduler.full-sync-interval-hours=6
scheduler.match-start-reminder-minutes=15

# Logging (Production level)
logging.level.root=INFO
logging.level.com.example.football=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator (Restricted in production)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
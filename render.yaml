services:
  # PostgreSQL Database (Free tier - expires after 30 days)
  - type: pserv
    name: football-score-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

  # Spring Boot Backend Web Service (Native build - no Dockerfile needed)
  - type: web
    name: football-score-api
    plan: free
    region: oregon
    runtime: java
    repo: https://github.com/Chethan505/score
    branch: main
    rootDir: football-score-app/backend
    buildCommand: ./mvnw -B package -DskipTests
    startCommand: java -jar target/football-score-app-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: football-score-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: football-score-db
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: football-score-db
          property: password
      # Set these as secrets in Render Dashboard:
      # - SPORTMONKS_API_TOKEN
      # - JWT_SECRET
      # - WHATSAPP_ACCESS_TOKEN
      # - WHATSAPP_PHONE_NUMBER_ID
      # - WHATSAPP_WABA_ID
      # - WHATSAPP_WEBHOOK_VERIFY_TOKEN
      # - WHATSAPP_APP_SECRET
      # - FRONTEND_URL
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true